# cargo-audit config: the single list of accepted advisories. Read automatically
# by `cargo audit` run from the repo root (CI audit.yml and build_portable.ps1).
#
# Audit F043: ignore transitive warning-level advisories (unmaintained/unsound,
# 0 actual vulnerabilities), reachability-validated as not exploitable here on
# 2026-06-17. GTK3-rs bindings (atk/gdk/gtk/gtk-sys/glib/gdkx11/gdkwayland) compile
# only on the Linux webview target (Windows is the primary platform); proc-macro-error,
# unic-*, and fxhash are build-time/transitive; rand is unused by app code
# (RUSTSEC-2026-0097 requires rand::rng() + a custom logger). Re-review yearly.
#
# 2026-10-08: the direct quick-xml dep is on 0.41 (fixed). RUSTSEC-2026-0194/0195
# remain only on transitive quick-xml 0.30 (xcb build-dep, Linux-only), 0.38 (plist,
# macOS-only Info.plist parsing in tauri; not in the Windows/Linux tree) and 0.39
# (wayland-scanner proc-macro, build-time, Linux). RUSTSEC-2026-0235: rkyv 0.7 is a
# lockfile-only optional dep of rust_decimal (via byte-unit), not compiled in
# (`cargo tree --target all -i rkyv` is empty); the app never reads rkyv archives.
# Re-review yearly.

[advisories]
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0235",
]
