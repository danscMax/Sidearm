<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  /* The menu popup's look: a dark card at the cursor, transparent around it. */
  :root {
    --bg: #1a1f16;
    --text: #e8eae4;
    --muted: rgba(232, 234, 228, 0.74);
    --dim: rgba(232, 234, 228, 0.45);
    --accent: #9fca69;
    --line: rgba(159, 202, 105, 0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; cursor: default; }
  .prompt {
    display: inline-flex;
    flex-direction: column;
    gap: 8px;
    width: 300px;
    margin: 4px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-size: 13.5px;
    color: var(--text);
  }
  .title { font-weight: 600; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .name { font-size: 12px; color: var(--muted); }
  .field input {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    outline: 0;
    background: rgba(0, 0, 0, 0.28);
    color: var(--text);
    font: inherit;
  }
  .field input:focus { border-color: var(--accent); }
  .hint { font-size: 11.5px; color: var(--dim); }
</style>
</head>
<body>
<div class="prompt" id="prompt"></div>
<script src="/prompt.js"></script>
</body>
</html>
